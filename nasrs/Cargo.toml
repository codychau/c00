[package]
name = "nasrs"
version = "0.1.0"
edition = "2021"
description = "用户态软件镜像（RAID1）：把主网目录完整拷到副本目录"
license = "MIT"

# 依赖保持为空：这个 crate 的可靠性来自"能审计"，
# 拉进 tokio/nix 之类会让一次 cargo update 就改变行为。
# 镜像只需要 std（目录遍历 + 拷贝 + rename），不需要 NBD/loop/io_uring ——
# RAID0 那条已删，导出层换成第三方 mergerfs，由发行版提供二进制。
[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
