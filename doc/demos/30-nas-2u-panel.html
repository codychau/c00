<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NAS 面板样式 Demo · 2U 前面板</title>
<style>
/* ══════════════════════════════════════════════════════════════
   2U 服务器前面板样式 Demo
   色值全部取自 theme.h，保证确认后能 1:1 迁到 Qt：
     bg #0b0f14  bgRaised #0e141b  surface #131a23  surface2 #1a2430
     surface3 #202d3b  border #26333f  borderHi #33475b
     text #e6edf3  dim #8b9bab  mute #5b6b7b
     accent #38bdf8  accent2 #a78bfa  ok #4ade80  warn #fbbf24  bad #f87171
     字体：正文 Noto Sans CJK SC；编号用 JetBrains Mono（机箱铭牌感）
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0b0f14; --bg-raised:#0e141b; --surface:#131a23; --surface2:#1a2430;
  --surface3:#202d3b; --border:#26333f; --border-hi:#33475b;
  --text:#e6edf3; --dim:#8b9bab; --mute:#5b6b7b;
  --accent:#38bdf8; --accent2:#a78bfa; --on-accent:#04121c;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  --mono:"JetBrains Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px; padding:26px; line-height:1.5;
}
h1{font-size:16px;font-weight:700;margin-bottom:4px}
.sub{color:var(--mute);font-size:12px;margin-bottom:20px}

/* ── 机箱：2U 机箱是宽扁的，比例约 3.2:1 ──
   真实前面板从上到下的层次：耳朵(挂耳) → 面板本体 → 耳朵上的螺丝 */
.chassis{
  position:relative; width:100%; max-width:1120px;
  background:linear-gradient(180deg,#161d26 0%,#0f151c 18%,#0c1117 100%);
  border:1px solid #060a0e; border-radius:5px;
  box-shadow:0 12px 40px rgba(0,0,0,.55),
             inset 0 1px 0 rgba(255,255,255,.045);
  padding:14px 56px;                 /* 左右留挂耳空间 */
}
/* 挂耳：机箱两端竖条，各带 2 颗螺丝（2U 是 4 颗固定螺丝） */
.ear{
  position:absolute; top:0; bottom:0; width:44px;
  background:linear-gradient(90deg,#11171e,#0c1218);
  border-right:1px solid #060a0e;
}
.ear.right{right:0;border-right:none;border-left:1px solid #060a0e;
           background:linear-gradient(270deg,#11171e,#0c1218)}
.ear.left{left:0}
.screw{
  position:absolute; left:50%; width:13px;height:13px;margin-left:-6.5px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4a5a6b,#1a232c 70%);
  border:1px solid #05080b;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.18);
}
/* 十字槽 */
.screw::before,.screw::after{
  content:"";position:absolute;background:#0a0e12;border-radius:1px}
.screw::before{left:50%;top:2.5px;width:1.5px;height:8px;margin-left:-.75px}
.screw::after{top:50%;left:2.5px;height:1.5px;width:8px;margin-top:-.75px}
.screw.t1{top:16px} .screw.t2{bottom:16px}

/* ── 左侧控制区：真实 2U 在这里放电源键、指示 LED、VGA、UID 按钮 ── */
.ctrl{
  display:flex;flex-direction:column;gap:9px;
  padding-right:16px;margin-right:16px;
  border-right:1px solid #060a0e;
}
.pwr{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#243040,#141c26);
  border:1px solid #05080b;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.12), 0 0 10px rgba(56,189,248,.16);
  display:grid;place-items:center;color:var(--accent);font-size:15px;
}
.leds{display:flex;flex-direction:column;gap:5px}
.led{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--mute);
     font-family:var(--mono);letter-spacing:.5px}
.bulb{width:7px;height:7px;border-radius:50%;background:#1c2530;
      border:1px solid #05080b;flex:none}
.bulb.on{background:var(--ok);box-shadow:0 0 6px var(--ok),inset 0 0 2px #fff}
.bulb.act{background:var(--warn);box-shadow:0 0 6px var(--warn);animation:blink 1.1s steps(1) infinite}
.bulb.uid{background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
@keyframes blink{50%{opacity:.25}}
/* UID 按钮：机架设备的"识别"按钮，亮起时前后板同步闪蓝 */
.uid-btn{
  width:34px;height:15px;border-radius:3px;
  background:linear-gradient(180deg,#1b2532,#141b23);
  border:1px solid #05080b;box-shadow:inset 0 1px 1px rgba(255,255,255,.07);
  position:relative;
}
.uid-btn::after{
  content:"UID";position:absolute;inset:0;display:grid;place-items:center;
  font:600 7px/1 var(--mono);color:var(--accent2);letter-spacing:.5px}

/* ── 盘位阵列：2U 常见 12×3.5"(2 行×6 列) 或 24×2.5"(2 行×12 列) ──
   这里演示 12 盘位。真盘位是**横长条**，不是方块。 */
.bays{flex:1;display:grid;grid-template-columns:repeat(6,1fr);
      grid-template-rows:repeat(2,1fr);gap:7px}

/* ── 单个硬盘托架（caddy）──
   真实 hot-swap 托架的元素：
     ① 扳手/释放把手（latch）—— 占托架左侧约 22%，可开合
     ② 把手转轴 —— 上下各一个圆点
     ③ 指纹/通风网孔 —— 中间区域
     ④ 两个 LED：上=活动(activity 黄闪) 下=状态(status 绿/橙)
     ⑤ 盘号标签
   这里用竖版托架（Dell R740xd / HPE DL380 那一类：把手在上，LED 在右上）*/
.bay{
  position:relative; aspect-ratio:1/1.32;
  background:linear-gradient(178deg,#1b232d 0%,#151c25 55%,#111820 100%);
  border:1px solid #05080b; border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),
             inset 0 -2px 4px rgba(0,0,0,.45),
             0 1px 2px rgba(0,0,0,.5);
  cursor:grab; transition:transform .14s,box-shadow .14s,border-color .14s;
  overflow:hidden;
}
.bay:hover{transform:translateY(-2px);border-color:var(--border-hi);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px rgba(0,0,0,.6)}
.bay:active{cursor:grabbing}

/* ① 释放把手：上窄下宽的斜边，金属感 */
.handle{
  position:absolute;left:5%;right:5%;top:5%;height:26%;
  background:linear-gradient(180deg,#2b3a4a,#1c2732);
  border:1px solid #05080b;border-radius:2px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.5);
}
/* 把手上的握持凹槽 */
.handle::before{
  content:"";position:absolute;left:16%;right:16%;top:34%;height:32%;
  background:linear-gradient(180deg,#0d1319,#161f29);
  border-radius:2px;box-shadow:inset 0 1px 2px rgba(0,0,0,.7);
}
/* ② 转轴：把手两端的小圆 */
.pivot{position:absolute;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#566a7c,#161f28);
  border:1px solid #05080b;top:31%}
.pivot.l{left:3%} .pivot.r{right:3%}

/* ③ 通风网孔：三排长条，用 repeating-linear-gradient 表现冲孔网 */
.vent{
  position:absolute;left:9%;right:9%;top:38%;height:42%;border-radius:2px;
  background:
    repeating-linear-gradient(180deg,
      rgba(0,0,0,.72) 0 2px, rgba(255,255,255,.028) 2px 4px),
    linear-gradient(180deg,#0e141a,#0b1016);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.85);
}

/* ④ LED 组：真实托架是上下两个小灯，藏在塑料导光柱里 */
.led-col{position:absolute;right:6%;top:34%;display:flex;
         flex-direction:column;gap:4px;align-items:center}
.drv-led{width:5px;height:5px;border-radius:1px;background:#151d26;
         border:1px solid #04070a}
.drv-led.act.on{background:var(--warn);box-shadow:0 0 5px var(--warn);
                animation:blink .5s steps(1) infinite}
.drv-led.st.on{background:var(--ok);box-shadow:0 0 5px var(--ok)}
.drv-led.st.fault{background:var(--bad);box-shadow:0 0 5px var(--bad)}
.drv-led.st.rebuild{background:var(--warn);box-shadow:0 0 5px var(--warn);
                    animation:blink .8s ease-in-out infinite}

/* ⑤ 盘号 */
.slot{
  position:absolute;left:8%;bottom:5%;font:700 9px/1 var(--mono);
  color:var(--mute);letter-spacing:.5px;
}

/* 容量小字 */
.cap{position:absolute;right:7%;bottom:6%;font:9px/1 var(--mono);color:var(--mute)}

/* ── 状态语义（这是重点：面板要一眼看出盘在干什么）── */
/* 空闲：整体压暗，不发光 */
.bay.empty{opacity:.5;filter:saturate(.4)}
/* 已选为阵列成员：主色描边 + 外发光 */
.bay.member{border-color:var(--accent);
  box-shadow:0 0 0 1px rgba(56,189,248,.45),0 0 14px rgba(56,189,248,.3),
             inset 0 1px 0 rgba(255,255,255,.08)}
.bay.member .slot{color:var(--accent)}
/* 条带序号：成员盘的**右上角**标 RAID 条带顺序，这是 RAID0 最需要的信息 */
.stripe{
  position:absolute;right:6%;top:34%;
  min-width:15px;height:15px;padding:0 3px;border-radius:3px;
  background:var(--accent);color:var(--on-accent);
  font:700 9px/15px var(--mono);text-align:center;
  box-shadow:0 0 8px rgba(56,189,248,.5);
}
/* 故障/不可选：红色斜线带 + 红 LED */
.bay.blocked{border-color:rgba(248,113,113,.55)}
.bay.blocked .vent{opacity:.45}
.bay.blocked .slot{color:var(--bad)}
.bay.blocked::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,
    transparent 0 8px,rgba(248,113,113,.11) 8px 16px);
}
/* 系统盘：锁标志，永远不可选 */
.lock{position:absolute;right:6%;top:34%;font-size:11px;opacity:.75}
/* 被阵列占用（已写入配置，非本次选择）：紫 */
.bay.inUse{border-color:rgba(167,139,250,.5)}
.bay.inUse .slot{color:var(--accent2)}

/* ── 右侧：阵列状态条（相当于阵列卡的位置）── */
.rail{
  display:flex;align-items:center;gap:14px;margin-top:16px;
  padding:11px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:4px;
}
.rail .lbl{font:700 11px/1 var(--mono);letter-spacing:1px;color:var(--mute)}
.rail .val{font:600 14px/1 var(--mono);color:var(--text)}
.rail .val.good{color:var(--ok)} .rail .val.warn{color:var(--warn)}
.rail .sep{width:1px;height:22px;background:var(--border)}
.rail .hint{margin-left:auto;color:var(--mute);font-size:11px}

.eng{
  background:var(--surface2); color:var(--dim); cursor:pointer;
  border:1px solid var(--border); border-radius:999px;
  padding:5px 13px; font-size:11px; font-weight:600;
  font-family:"Noto Sans CJK SC","PingFang SC",sans-serif;
}
.eng:hover{color:var(--text);border-color:var(--border-hi);background:var(--surface3)}
.eng.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* 底部图例 */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;
        font-size:11px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;border-radius:2px;border:1px solid var(--border)}
</style>
</head>
<body>

<h1>NAS 面板 · 2U 前面板样式 Demo</h1>
<div class="sub">
  拖动盘位把它"插入"阵列；点已选中的盘可拔出。样式确认后我照这个改 Qt 的 NasBoardWidget。
</div>

<div class="chassis">
  <div class="ear left"><div class="screw t1"></div><div class="screw t2"></div></div>
  <div class="ear right"><div class="screw t1"></div><div class="screw t2"></div></div>

  <div style="display:flex;align-items:stretch">
    <div class="ctrl">
      <div class="pwr">⏻</div>
      <div class="leds">
        <div class="led"><i class="bulb on"></i>PWR</div>
        <div class="led"><i class="bulb act"></i>HDD</div>
        <div class="led"><i class="bulb uid"></i>UID</div>
      </div>
      <div class="uid-btn"></div>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:8px;align-items:center">
        <button class="eng" id="engMdadm">mdadm（内核 RAID，会抹分区）</button>
        <button class="eng" id="engNasrs">nasrs（自家 RAID0，只写文件）</button>
        <span style="color:var(--mute);font-size:11px;margin-left:auto" id="engNote"></span>
      </div>
      <div class="bays" id="bays"></div>
    </div>
  </div>
</div>

<div class="rail">
  <div class="lbl">ARRAY</div><div class="val" id="aName">—</div>
  <div class="sep"></div>
  <div class="lbl">LEVEL</div><div class="val">RAID0</div>
  <div class="sep"></div>
  <div class="lbl">MEMBERS</div><div class="val" id="aCnt">0</div>
  <div class="sep"></div>
  <div class="lbl">USABLE</div><div class="val warn" id="aCap">—</div>
  <div class="hint" id="hint">拖动盘位加入阵列</div>
</div>

<div class="legend">
  <span><i class="sw" style="border-color:var(--accent);box-shadow:0 0 6px rgba(56,189,248,.5)"></i>本次选为成员</span>
  <span><i class="sw" style="background:var(--accent2);opacity:.6"></i>已在阵列中</span>
  <span><i class="sw" style="background:var(--bad);opacity:.5"></i>不可选（系统盘/已挂载/已损坏）</span>
  <span><i class="sw" style="background:var(--warn)"></i>重建中</span>
  <span>🔒 系统盘，永不可选</span>
</div>

<script>
// 模拟本机真实设备（对应 lsblk 的 sda/sdb/nvme0n1）
const DISKS = [
  {n:0, name:"sda1",  size:3.64, st:"free"},
  {n:1, name:"sdb1",  size:5.46, st:"free"},
  {n:2, name:"nvme0n1p2", size:0.237, st:"sys",  reason:"系统盘"},
  {n:3, name:"sdc1",  size:8.0,  st:"inUse", array:"nas-data"},
  {n:4, name:"sdd1",  size:8.0,  st:"inUse", array:"nas-data"},
  {n:5, name:"sde1",  size:2.0,  st:"fault", reason:"SMART 告警"},
  {n:6, name:"sdf1",  size:4.0,  st:"free"},
  {n:7, name:"sdg1",  size:4.0,  st:"mounted", reason:"已挂载 /mnt/x"},
  {n:8, name:"sr0",   size:0,    st:"empty"},
  {n:9, name:"sdh1",  size:16.0, st:"free"},
  {n:10,name:"sdi1",  size:16.0, st:"free"},
  {n:11,name:"md0",   size:0,    st:"empty"},
];
let engine = "mdadm";
let picked = [];

const box = document.getElementById("bays");
DISKS.forEach(d=>{
  const el = document.createElement("div");
  el.className = "bay";
  // 可用性取决于当前引擎，与 Qt 的 judge() 同一套规则：
  //   mdadm 会抹分区 → 已挂载不可选
  //   nasrs 往已有文件系统写文件 → 已挂载反而是前提
  const isBlocked = () => {
    if (d.st==="sys" || d.st==="fault" || d.st==="empty") return true;
    if (d.st==="mounted") return engine === "mdadm";
    return false;
  };
  if (d.st==="empty")  el.classList.add("empty");
  if (d.st==="inUse")  el.classList.add("inUse");
  // inUse 是"已被别的阵列占用"，不是故障 → 用紫色，不叠红斜纹
  if (isBlocked() && d.st!=="inUse") el.classList.add("blocked");

  let topRight = "";
  if (d.st==="sys")     topRight = '<div class="lock">🔒</div>';
  else if (d.st==="fault")   topRight = '<div class="led-col"><i class="drv-led st fault on"></i><i class="drv-led"></i></div>';
  else if (d.st==="inUse")   topRight = '<div class="led-col"><i class="drv-led st on rebuild"></i><i class="drv-led act on"></i></div>';
  else if (d.st==="free")    topRight = '<div class="led-col"><i class="drv-led st"></i><i class="drv-led act"></i></div>';
  else                       topRight = '<div class="led-col"><i class="drv-led"></i><i class="drv-led"></i></div>';

  el.innerHTML = `
    <div class="handle"></div>
    <div class="pivot l"></div><div class="pivot r"></div>
    <div class="vent"></div>
    ${topRight}
    <div class="slot">${String(d.n+1).padStart(2,"0")}</div>
    <div class="cap">${d.size? d.size+"T" : "--"}</div>`;
  el.title = d.name + (d.reason ? "\n" + d.reason : "");
  el.dataset.n = d.n;

  el.addEventListener("click", ()=>{
    if (isBlocked()){
      show("hint", "盘 " + (d.n+1) + " 不可用：" + (d.reason||"空位"), true); return;
    }
    const i = picked.indexOf(d.n);
    if (i >= 0) picked.splice(i,1);
    else if (picked.length < 8) picked.push(d.n);
    else { show("hint","RAID0 最多 8 个成员", true); return; }
    render();
  });
  box.appendChild(el);
});

function fmt(t){ return t >= 1 ? t.toFixed(2)+" TiB" : (t*1024).toFixed(0)+" GiB"; }
function show(id,t,bad){
  const e = document.getElementById(id);
  e.textContent = t;
  e.style.color = bad ? "var(--bad)" : "";
}

function render(){
  document.querySelectorAll(".bay").forEach(el=>{
    const n = +el.dataset.n;
    const d = DISKS[n];
    el.querySelectorAll(".stripe").forEach(x=>x.remove());
    // 引擎切换后可用性会变，重画斜纹
    const bad = (d.st==="sys"||d.st==="fault"||d.st==="empty")
             || (d.st==="mounted" && engine==="mdadm");
    el.classList.toggle("blocked", bad && d.st!=="inUse");
    const idx = picked.indexOf(n);
    if (idx < 0){ el.classList.remove("member"); return; }
    el.classList.add("member");
    // 条带序号画在盘上：RAID0 写的时候是 0,1,2,3… 轮流下发，
    // 顺序直接决定数据落在哪个盘，所以必须可见
    const s = document.createElement("div");
    s.className = "stripe"; s.textContent = idx;
    el.appendChild(s);
  });
  document.getElementById("aCnt").textContent = picked.length;
  const nm = document.getElementById("aName");
  const cap = document.getElementById("aCap");
  if (!picked.length){ nm.textContent="—"; cap.textContent="—"; return; }
  nm.textContent = "nas-data";
  if (picked.length === 1){
    cap.textContent = fmt(DISKS[picked[0]].size);
    cap.className = "val warn";
    show("hint","单盘不算 RAID，等同直连", true); return;
  }
  // RAID0 可用 = 最小成员 × 成员数（不是求和！）
  const sizes = picked.map(i=>DISKS[i].size);
  const min = Math.min(...sizes);
  const usable = min*picked.length, waste = sizes.reduce((a,b)=>a+b,0)-usable;
  cap.textContent = fmt(usable);
  cap.className = "val " + (waste > 0.01 ? "warn" : "good");
  show("hint", waste > 0.01
    ? "按最小的 "+fmt(min)+" 计，多出的 "+fmt(waste)+" 用不上"
    : picked.length+" 路条带，容量等长无浪费");
}
function setEngine(e){
  engine = e;
  document.getElementById("engMdadm").classList.toggle("on", e==="mdadm");
  document.getElementById("engNasrs").classList.toggle("on", e==="nasrs");
  document.getElementById("engNote").textContent = e==="mdadm"
    ? "抹分区 → 已挂载的盘不可选" : "写文件 → 已挂载的盘才可用";
  // 换引擎后原选中盘可能变不可用，必须清掉，否则会生成非法方案
  picked = picked.filter(i => {
    const s = DISKS[i].st;
    return !(s==="sys"||s==="fault"||s==="empty"||(s==="mounted"&&e==="mdadm"));
  });
  render();
}
document.getElementById("engMdadm").onclick = ()=>setEngine("mdadm");
document.getElementById("engNasrs").onclick = ()=>setEngine("nasrs");
setEngine("mdadm");
</script>
</body>
</html>
